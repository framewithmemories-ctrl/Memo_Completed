name: Security change-password hardening

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  harden-change-password:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Harden change-password minimum length
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path("backend/server.py")
          text = path.read_text(encoding="utf-8")

          start = text.index('@api_router.post("/auth/change-password")')
          end = text.index('\n\n@api_router.get("/auth/me")', start)
          block = text[start:end]

          old = 'if len(req.new_password) < 6:\n        raise HTTPException(status_code=400, detail="Password must be at least 6 characters")'
          new = 'if len(req.new_password) < 8:\n        raise HTTPException(status_code=400, detail="Password must be at least 8 characters")'

          if old not in block:
              if 'if len(req.new_password) < 8:' in block:
                  print("Change-password minimum is already 8; no change needed.")
              else:
                  raise SystemExit("Targeted change-password password-length check not found; refusing to patch")
          else:
              block = block.replace(old, new, 1)
              text = text[:start] + block + text[end:]
              path.write_text(text, encoding="utf-8")
              print("Hardened change-password minimum from 6 to 8 characters.")
          PY

      - name: Validate Python syntax
        run: python -m py_compile backend/server.py

      - name: Commit change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/server.py
          git diff --cached --quiet && echo "No source change needed" && exit 0
          git commit -m "security: align change-password minimum with account recovery"
          git push origin main
