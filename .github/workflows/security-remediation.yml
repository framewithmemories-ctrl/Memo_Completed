name: Security verification

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  password-reset-security-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Validate Python syntax
        run: python -m py_compile backend/server.py

      - name: Verify password reset security
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          s = Path('backend/server.py').read_text()

          required_model = '''class ResetPasswordRequest(BaseModel):
              email: str
              new_password: str
              token: str'''
          if required_model not in s:
              raise SystemExit('Secure ResetPasswordRequest model is missing')

          if 'phone: Optional[str]' in s[s.index('class ResetPasswordRequest'):s.index('def _hash_token')]:
              raise SystemExit('ResetPasswordRequest must not accept phone verification')

          reset_start = s.index('@api_router.post("/auth/reset-password")')
          reset_end = s.index('\n\nclass ChangePasswordRequest', reset_start)
          reset_block = s[reset_start:reset_end]

          required_checks = [
              'if not req.token or len(req.token) > 512:',
              'token_hash": _hash_token(req.token)',
              '"used": False',
              'if exp_dt < datetime.now(timezone.utc):',
              '"used": True, "used_at": datetime.now(timezone.utc)',
              'hash_password(req.new_password)',
          ]
          missing = [x for x in required_checks if x not in reset_block]
          if missing:
              raise SystemExit('Password reset security checks missing: ' + ', '.join(missing))

          forgot_start = s.index('@api_router.post("/auth/forgot-password")')
          forgot_end = s.index('\n\n@api_router.post("/auth/reset-password")', forgot_start)
          forgot_block = s[forgot_start:forgot_end]
          if 'return generic' not in forgot_block:
              raise SystemExit('Forgot-password endpoint must return a generic response')
          if 'raw_token' not in forgot_block or 'token_hash' not in forgot_block:
              raise SystemExit('Forgot-password endpoint must create a hashed reset token')
          if 'return {"token"' in forgot_block or 'return {"reset_token"' in forgot_block:
              raise SystemExit('Raw reset token must not be returned by the API')

          print('Password reset security verification passed.')
          PY
