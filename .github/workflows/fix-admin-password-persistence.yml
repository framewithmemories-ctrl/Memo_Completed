name: Fix admin password persistence

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/fix-admin-password-persistence.yml'
      - 'backend/server.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Remove admin password reseeding
        shell: python
        run: |
          from pathlib import Path
          import re
          import subprocess

          path = Path('backend/server.py')
          text = path.read_text(encoding='utf-8')

          replacement = '''        # Environment credentials are bootstrap credentials only. Once an admin
        # record exists, never overwrite a database-managed password on restart.
        # Password changes and recovery are persisted in MongoDB.
'''

          # Match the complete password-reseeding branch structurally. This tolerates
          # harmless formatting changes while refusing to edit an unknown code shape.
          pattern = re.compile(
              r'^        elif not verify_password\(password, existing\.get\("password_hash", ""\)\):\n'
              r'(?:^            .*\n)*?'
              r'^            logger\.info\(f"Updated admin password for: \{username\}"\)\n',
              re.MULTILINE,
          )

          match = pattern.search(text)
          if match:
              text = text[:match.start()] + replacement + text[match.end():]
              print('Removed admin password reseeding block using structural match.')
          elif 'Environment credentials are bootstrap credentials only.' in text:
              print('Admin password persistence guard already present.')
          else:
              raise SystemExit('Admin password reseeding block was not found; refusing to modify server.py.')

          path.write_text(text, encoding='utf-8')
          subprocess.run(['python', '-m', 'py_compile', 'backend/server.py'], check=True)
          subprocess.run(['git', 'diff', '--check'], check=True)
          print('PY_COMPILE_OK')

      - name: Verify repair
        shell: python
        run: |
          from pathlib import Path
          text = Path('backend/server.py').read_text(encoding='utf-8')
          if 'elif not verify_password(password, existing.get("password_hash", "")):' in text:
              raise SystemExit('Admin password reseeding is still present.')
          if 'Environment credentials are bootstrap credentials only.' not in text:
              raise SystemExit('Bootstrap-only admin password guard is missing.')
          print('ADMIN_PASSWORD_PERSISTENCE_GUARD_OK')

      - name: Commit fix and remove one-time workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/server.py
          if git diff --cached --quiet; then
            echo "No source change needed"
          else
            git commit -m "security: preserve database-managed admin password"
            git push origin main
          fi
          git rm .github/workflows/fix-admin-password-persistence.yml
          git commit -m "chore: remove one-time admin password persistence fixer"
          git push origin main
