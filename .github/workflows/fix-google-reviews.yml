name: Wire genuine Google reviews

on:
  push:
    branches: [main]
    paths-ignore:
      - '.github/workflows/**'

permissions:
  contents: write

jobs:
  wire-google-reviews:
    if: ${{ !startsWith(github.event.head_commit.message, 'chore(reviews):') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Replace mock Google reviews with 3-day cached Places API integration
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path('backend/server.py')
          text = path.read_text(encoding='utf-8')

          start_marker = '@api_router.get("/google-reviews")'
          end_marker = '@api_router.put("/admin/reviews/{review_id}/pin")'
          start = text.find(start_marker)
          end = text.find(end_marker, start)
          if start == -1 or end == -1:
              raise SystemExit('Google reviews route markers not found; refusing to modify server.py.')

          replacement = r'''@api_router.get("/google-reviews")
async def google_reviews():
    """Return genuine Google Business Profile reviews.

    Google Places review content is refreshed at most once every 72 hours and is
    not served from a fabricated/mock dataset. The cached payload is replaced
    on refresh and is not retained indefinitely.
    """
    api_key = os.environ.get("GOOGLE_PLACES_API_KEY", "").strip()
    place_id = os.environ.get("GOOGLE_PLACE_ID", "").strip() or "ChIJ9dQb1b33qDsRTLJ9I1nkuqo"
    google_url = os.environ.get("GOOGLE_REVIEWS_URL", "").strip()
    if not google_url:
        google_url = f"https://search.google.com/local/reviews?placeid={place_id}"

    if not api_key:
        return {
            "configured": False,
            "rating": 0,
            "total": 0,
            "google_url": google_url,
            "reviews": [],
        }

    now = datetime.now(timezone.utc)
    cache = await db.google_reviews_cache.find_one({"key": "google_reviews"}, {"_id": 0})
    if cache:
        try:
            fetched_at = datetime.fromisoformat(str(cache.get("fetched_at", "")).replace("Z", "+00:00"))
            if fetched_at.tzinfo is None:
                fetched_at = fetched_at.replace(tzinfo=timezone.utc)
            if (now - fetched_at).total_seconds() < 72 * 60 * 60:
                return {
                    "configured": True,
                    "rating": cache.get("rating", 0),
                    "total": cache.get("total", 0),
                    "google_url": cache.get("google_url", google_url),
                    "reviews": cache.get("reviews", []),
                    "cached": True,
                    "fetched_at": fetched_at.isoformat(),
                }
        except Exception:
            pass

    try:
        async with httpx.AsyncClient(timeout=10) as http_client:
            resp = await http_client.get(
                "https://maps.googleapis.com/maps/api/place/details/json",
                params={
                    "place_id": place_id,
                    "fields": "rating,user_ratings_total,reviews,url",
                    "reviews_sort": "newest",
                    "key": api_key,
                },
            )
        data = resp.json()
        if data.get("status") != "OK":
            logger.error(f"Google Places API status: {data.get('status')} {data.get('error_message', '')}")
            await db.google_reviews_cache.delete_one({"key": "google_reviews"})
            return {"configured": False, "rating": 0, "total": 0, "google_url": google_url, "reviews": [], "error": data.get("status")}

        result = data.get("result", {})
        reviews = [
            {
                "author_name": r.get("author_name", "Google customer"),
                "rating": r.get("rating", 0),
                "text": r.get("text", ""),
                "relative_time": r.get("relative_time_description", ""),
                "profile_photo_url": r.get("profile_photo_url", ""),
            }
            for r in result.get("reviews", [])
            if r.get("text")
        ]
        payload = {
            "key": "google_reviews",
            "rating": result.get("rating", 0),
            "total": result.get("user_ratings_total", 0),
            "google_url": result.get("url") or google_url,
            "reviews": reviews,
            "fetched_at": now.isoformat(),
        }
        await db.google_reviews_cache.replace_one({"key": "google_reviews"}, payload, upsert=True)
        return {
            "configured": True,
            "rating": payload["rating"],
            "total": payload["total"],
            "google_url": payload["google_url"],
            "reviews": reviews,
            "cached": False,
            "fetched_at": now.isoformat(),
        }
    except Exception as e:
        logger.error(f"Google reviews fetch error: {e}")
        await db.google_reviews_cache.delete_one({"key": "google_reviews"})
        return {"configured": False, "rating": 0, "total": 0, "google_url": google_url, "reviews": [], "error": "fetch_failed"}


'''
          text = text[:start] + replacement + text[end:]
          path.write_text(text, encoding='utf-8')

      - name: Commit Google review wiring
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/server.py
          git diff --cached --quiet && exit 0
          git commit -m 'chore(reviews): wire genuine Google review cache'
          git push origin main
