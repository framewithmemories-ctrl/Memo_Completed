name: Repair Admin UI
on:
  push:
    branches:
      - feat/memories-visual-polish
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch AdminPanel
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('frontend/src/components/AdminPanel.js')
          s = p.read_text()
          original = s

          s = s.replace(
              "const [genDescLoading, setGenDescLoading] = useState(false);",
              "const [genDescLoading, setGenDescLoading] = useState(false);\n  const [productImageUploading, setProductImageUploading] = useState(false);"
          )

          marker = "  // Public config (shop WhatsApp number)"
          helper = '''  const uploadProductImage = async (file) => {\n    if (!file) return;\n    if (!file.type?.startsWith('image/')) { toast.error('Please select an image file'); return; }\n    if (file.size > 15 * 1024 * 1024) { toast.error('Image must be 15 MB or smaller'); return; }\n    setProductImageUploading(true);\n    try {\n      const data = new FormData();\n      data.append('file', file);\n      const response = await axios.post(`${API}/upload-image`, data, { headers: { 'Content-Type': 'multipart/form-data' } });\n      const mime = file.type || 'image/jpeg';\n      const imageData = `data:${mime};base64,${response.data.image_data}`;\n      setProductForm((f) => ({ ...f, image_url: imageData }));\n      toast.success(response.data.quality_warning ? 'Image uploaded; print quality may be limited for large frames.' : 'Image uploaded successfully.');\n    } catch (error) {\n      toast.error(error.response?.data?.detail || 'Unable to upload image');\n    } finally {\n      setProductImageUploading(false);\n    }\n  };\n\n'''
          if marker in s and 'const uploadProductImage' not in s:
              s = s.replace(marker, helper + marker, 1)

          old_image = '''            <div>\n              <Label htmlFor="p-img">Image URL</Label>\n              <Input id="p-img" value={productForm.image_url} onChange={(e) => setProductForm({ ...productForm, image_url: e.target.value })} className="mt-1" placeholder="https://..." data-testid="product-image-input" />\n            </div>'''
          new_image = '''            <div className="space-y-3">\n              <Label htmlFor="p-img">Product Image</Label>\n              <div className="flex flex-wrap items-center gap-2">\n                <label className="inline-flex cursor-pointer items-center gap-2 rounded-md border px-3 py-2 text-sm font-medium hover:bg-accent">\n                  <Upload className="h-4 w-4" />\n                  {productImageUploading ? 'Uploading…' : 'Upload Image'}\n                  <input type="file" accept="image/jpeg,image/png,image/heic,image/heif" className="hidden" disabled={productImageUploading} onChange={(e) => { uploadProductImage(e.target.files?.[0]); e.target.value = ''; }} />\n                </label>\n                <span className="text-xs text-gray-500">JPG, PNG or HEIC · max 15 MB</span>\n              </div>\n              {productForm.image_url && <img src={productForm.image_url} alt="Product preview" className="h-28 w-full rounded-lg border object-contain bg-gray-50" />}\n              <Input id="p-img" value={productForm.image_url} onChange={(e) => setProductForm({ ...productForm, image_url: e.target.value })} className="mt-1" placeholder="Or paste an image URL" data-testid="product-image-input" />\n            </div>'''
          if old_image in s:
              s = s.replace(old_image, new_image, 1)

          demo = '''            <div className="mt-6 p-4 bg-gray-50 rounded-lg">\n              <p className="text-sm text-gray-600 mb-2">Demo Credentials:</p>\n              <p className="text-xs text-gray-500">Username: admin</p>\n              <p className="text-xs text-gray-500">Password: memories2024</p>\n            </div>'''
          recovery = '''            <div className="mt-6 text-center">\n              <a href={`${BACKEND_URL}/admin/recover`} target="_blank" rel="noreferrer" className="text-sm font-medium text-rose-600 hover:underline">Forgot admin password?</a>\n            </div>'''
          if demo in s:
              s = s.replace(demo, recovery, 1)

          if s == original:
              print('No AdminPanel changes were necessary.')
          else:
              p.write_text(s)
              print('AdminPanel patched successfully.')
          PY
      - name: Commit AdminPanel repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/components/AdminPanel.js
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "fix: repair admin recovery and product image controls"
            git push
          fi
