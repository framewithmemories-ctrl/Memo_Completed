name: One-time admin password source repair

on:
  push:
    branches:
      - feat/memories-visual-polish

permissions:
  contents: write

jobs:
  repair:
    if: github.event.head_commit.message != 'chore: remove one-time admin password source repair [skip ci]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/memories-visual-polish
          fetch-depth: 1

      - name: Patch admin startup seeding
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('backend/server.py')
          s = p.read_text()
          old = '''        elif not verify_password(password, existing.get("password_hash", "")):\n            await db.admins.update_one(\n                {"username": username},\n                {"$set": {"password_hash": hash_password(password)}},\n            )\n            logger.info(f"Updated admin password for: {username}")\n'''
          new = '''        # Environment credentials are bootstrap credentials only. Once an admin\n        # record exists, never overwrite a database-managed password on restart.\n        # This preserves password changes made through the Admin recovery flow.\n'''
          if old not in s:
              raise SystemExit('Expected admin password reseed block was not found; refusing to modify the file.')
          p.write_text(s.replace(old, new, 1))
          PY

      - name: Commit repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/server.py
          git commit -m "fix: preserve database-managed admin password [skip ci]"
          git push origin feat/memories-visual-polish

      - name: Remove one-time workflow
        run: |
          git rm .github/workflows/repair-admin-password-source.yml
          git commit -m "chore: remove one-time admin password source repair [skip ci]"
          git push origin feat/memories-visual-polish
