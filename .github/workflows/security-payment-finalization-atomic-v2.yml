name: Security payment finalization atomic v2

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/security-payment-finalization-atomic-v2.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - name: Patch payment finalization
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('backend/server.py')
          text = path.read_text(encoding='utf-8')
          start_marker = '    # --- Payment verified: commit state exactly once ---'
          end_marker = '\n\n    # Commit store-credit deduction now (only after successful payment); guard double-commit'
          start = text.find(start_marker)
          end = text.find(end_marker, start)
          if start == -1 or end == -1:
              if 'atomically transition pending -> paid exactly once' in text:
                  print('already hardened')
                  raise SystemExit(0)
              raise SystemExit('payment finalization block not found')
          replacement = '''    # --- Payment verified: atomically transition pending -> paid exactly once ---
    # Only the request that wins this conditional update may continue with financial side effects.
    transition = await db.orders.update_one(
        {"id": payload.order_id, "payment_status": {"$ne": "paid"}},
        {"$set": {
            "status": "processing",
            "payment_status": "paid",
            "order_status": "confirmed",
            "razorpay_payment_id": payload.razorpay_payment_id,
            "razorpay_signature": payload.razorpay_signature,
            "payment_updated_at": datetime.now(timezone.utc),
        }},
    )
    if transition.modified_count != 1:
        latest = await db.orders.find_one({"id": payload.order_id})
        if latest and latest.get("payment_status") == "paid":
            if payload.razorpay_payment_id and latest.get("razorpay_payment_id") and payload.razorpay_payment_id != latest.get("razorpay_payment_id"):
                raise HTTPException(status_code=409, detail="Order already paid with a different payment")
            return {"success": True, "order_id": payload.order_id,
                    "status": latest.get("status", "processing"), "mode": PAYMENT_MODE, "already_paid": True}
        raise HTTPException(status_code=409, detail="Payment state changed; please retry")'''
          path.write_text(text[:start] + replacement + text[end:], encoding='utf-8')
          print('patched payment finalization')
          PY
      - name: Validate
        run: python -m py_compile backend/server.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/server.py
          git diff --cached --quiet && echo "No source change needed" && exit 0
          git commit -m "security: atomically finalize verified payments"
          git push origin main
