name: Fix reward points sync

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/fix-reward-points-sync.yml"

permissions:
  contents: write

jobs:
  sync-reward-points:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Patch profile synchronization
        shell: python
        run: |
          from pathlib import Path

          auth = Path("frontend/src/context/AuthContext.js")
          text = auth.read_text(encoding="utf-8")

          old = '''  const logout = useCallback(() => {
    localStorage.removeItem('memoriesAuth');
    setAuthHeader(null);
    setToken(null);
    setUser(null);
    syncLegacyProfile(null);
  }, []);

  return (
    <AuthContext.Provider value={{ user, token, loading, login, register, changePassword, logout, isAuthenticated: !!user }}>
'''
          new = '''  const refreshUser = useCallback(async () => {
    if (!token) return null;
    const res = await axios.get(`${API}/auth/me`, {
      headers: { Authorization: `Bearer ${token}` },
    });
    const freshUser = res.data.user;
    setUser(freshUser);
    localStorage.setItem('memoriesAuth', JSON.stringify({ token, user: freshUser }));
    syncLegacyProfile(freshUser);
    return freshUser;
  }, [token]);

  const logout = useCallback(() => {
    localStorage.removeItem('memoriesAuth');
    setAuthHeader(null);
    setToken(null);
    setUser(null);
    syncLegacyProfile(null);
  }, []);

  // Reconcile the cached profile whenever the user returns to the tab/window.
  // This prevents the Profile tab from displaying stale reward/spending values.
  useEffect(() => {
    if (!token) return undefined;
    const reconcile = () => { refreshUser().catch(() => {}); };
    window.addEventListener('focus', reconcile);
    document.addEventListener('visibilitychange', reconcile);
    return () => {
      window.removeEventListener('focus', reconcile);
      document.removeEventListener('visibilitychange', reconcile);
    };
  }, [token, refreshUser]);

  return (
    <AuthContext.Provider value={{ user, token, loading, login, register, changePassword, refreshUser, logout, isAuthenticated: !!user }}>
'''
          if old not in text:
              raise SystemExit("AuthContext anchor not found; refusing to patch")
          auth.write_text(text.replace(old, new, 1), encoding="utf-8")

          account = Path("frontend/src/components/AccountButton.js")
          text = account.read_text(encoding="utf-8")

          old = '''  const { user, isAuthenticated, token, login, register, changePassword, logout } = useAuth();
'''
          new = '''  const { user, isAuthenticated, token, login, register, changePassword, refreshUser, logout } = useAuth();
'''
          if old not in text:
              raise SystemExit("AccountButton auth hook anchor not found; refusing to patch")
          text = text.replace(old, new, 1)

          old = '''          {activeTab === 'wallet' && <DigitalWallet userId={user.id} />}
'''
          new = '''          {activeTab === 'wallet' && <DigitalWallet userId={user.id} onBalanceUpdate={(wallet) => {
            setUser((prev) => prev ? {
              ...prev,
              wallet_balance: wallet.balance,
              points: wallet.rewardPoints,
              store_credits: wallet.storeCredits,
              tier: wallet.tier,
              total_spent: wallet.totalSpent,
            } : prev);
          }} />}
'''
          if old not in text:
              raise SystemExit("AccountButton wallet anchor not found; refusing to patch")
          text = text.replace(old, new, 1)
          account.write_text(text, encoding="utf-8")

      - name: Patch order reward and spending accounting
        shell: python
        run: |
          from pathlib import Path
          p = Path("backend/server.py")
          s = p.read_text(encoding="utf-8")

          # Track whether points/spending have been committed for an order.
          old = '''    payment_method: Optional[str] = None
    payment_attempts: int = 0
'''
          new = '''    payment_method: Optional[str] = None
    points_awarded: bool = False
    spent_recorded: bool = False
    payment_attempts: int = 0
'''
          if old in s and "points_awarded: bool = False" not in s:
              s = s.replace(old, new, 1)

          # COD orders are accepted at checkout, so award the advertised purchase
          # points and record committed order value exactly once after insert.
          old = '''    if store_credit_applied > 0:
        updated_user = await db.users.find_one({"id": order.user_id})
        balance_after = float((updated_user or {}).get("wallet_balance", 0.0) or 0.0)
        await db.wallet_transactions.insert_one(
            WalletTransaction(
                user_id=order.user_id,
                type="debit",
                amount=store_credit_applied,
                description=f"Store credit for order #{order_obj.id[:8]}",
                category="purchase",
                order_id=order_obj.id,
                balance_after=balance_after,
            ).dict()
        )
    
    # Purchase points are awarded only after verified payment.
    # Do not mutate the user's reward balance while an order is unpaid.

    return order_obj
'''
          new = '''    if store_credit_applied > 0:
        updated_user = await db.users.find_one({"id": order.user_id})
        balance_after = float((updated_user or {}).get("wallet_balance", 0.0) or 0.0)
        await db.wallet_transactions.insert_one(
            WalletTransaction(
                user_id=order.user_id,
                type="debit",
                amount=store_credit_applied,
                description=f"Store credit for order #{order_obj.id[:8]}",
                category="purchase",
                order_id=order_obj.id,
                balance_after=balance_after,
            ).dict()
        )

    if (order.payment_method or "cod").lower() == "cod" and order.user_id:
        pts = int(order_obj.points_earned or 0)
        inc = {"total_spent": float(order_obj.total_amount)}
        if pts > 0:
            inc["points"] = pts
        if inc:
            await db.users.update_one({"id": order.user_id}, {"$inc": inc})
        await db.orders.update_one(
            {"id": order_obj.id},
            {"$set": {"points_awarded": True, "spent_recorded": True}},
        )

        if pts > 0:
            u = await db.users.find_one({"id": order.user_id})
            new_points = int((u or {}).get("points", 0) or 0)
            new_tier = "Platinum" if new_points >= 5000 else "Gold" if new_points >= 2000 else "Silver"
            await db.users.update_one({"id": order.user_id}, {"$set": {"tier": new_tier}})
            await db.wallet_transactions.insert_one(
                WalletTransaction(
                    user_id=order.user_id,
                    type="credit",
                    amount=pts,
                    description=f"Reward points for order #{order_obj.id[:8]}",
                    category="rewards",
                    order_id=order_obj.id,
                    balance_after=float((u or {}).get("wallet_balance", 0.0) or 0.0),
                    is_points=True,
                ).dict()
            )

    return order_obj
'''
          if old not in s:
              raise SystemExit("create_order post-insert anchor not found; refusing to patch")
          s = s.replace(old, new, 1)

          # Razorpay: once payment is verified, record spend once and do not award
          # points twice if verification is retried.
          old = '''    # Award purchase points once (idempotent via payment_status transition above)
    pts = int(order.get("points_earned", 0) or 0)
    if pts > 0 and order.get("user_id"):
        u = await db.users.find_one({"id": order["user_id"]})
        if u:
            new_points = int(u.get("points", 0) or 0) + pts
            new_tier = (
                "Platinum"
                if new_points >= 5000
                else "Gold"
                if new_points >= 2000
                else "Silver"
            )
            await db.users.update_one(
                {"id": order["user_id"]},
                {"$set": {"points": new_points, "tier": new_tier}},
            )
'''
          new = '''    # Award purchase points and spending once (idempotent via order flags).
    if order.get("user_id"):
        current_order = await db.orders.find_one({"id": payload.order_id}) or order
        pts = int(order.get("points_earned", 0) or 0)
        if not current_order.get("points_awarded"):
            u = await db.users.find_one({"id": order["user_id"]})
            if u:
                new_points = int(u.get("points", 0) or 0) + pts
                new_tier = "Platinum" if new_points >= 5000 else "Gold" if new_points >= 2000 else "Silver"
                inc = {"points": pts}
                await db.users.update_one({"id": order["user_id"]}, {"$inc": inc, "$set": {"tier": new_tier}})
                await db.orders.update_one({"id": payload.order_id, "points_awarded": {"$ne": True}}, {"$set": {"points_awarded": True}})
                if pts > 0:
                    await db.wallet_transactions.insert_one(
                        WalletTransaction(
                            user_id=order["user_id"], type="credit", amount=pts,
                            description=f"Reward points for order #{payload.order_id[:8]}",
                            category="rewards", order_id=payload.order_id,
                            balance_after=float(u.get("wallet_balance", 0.0) or 0.0), is_points=True,
                        ).dict()
                    )
        if not current_order.get("spent_recorded"):
            await db.users.update_one({"id": order["user_id"]}, {"$inc": {"total_spent": float(order.get("total_amount", 0.0) or 0.0)}})
            await db.orders.update_one({"id": payload.order_id, "spent_recorded": {"$ne": True}}, {"$set": {"spent_recorded": True}})
'''
          if old not in s:
              raise SystemExit("Razorpay reward anchor not found; refusing to patch")
          s = s.replace(old, new, 1)

          # Keep Profile -> Spent meaningful by returning the stored aggregate.
          p.write_text(s, encoding="utf-8")
          print("Order reward/spending accounting patch applied")

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          CI=true npm run build

      - name: Commit and push
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/context/AuthContext.js frontend/src/components/AccountButton.js backend/server.py
          if git diff --cached --quiet; then
            echo "No source change needed"
            exit 0
          fi
          git commit -m "fix: reconcile order spending and COD reward points"
          git push origin main
