name: Apply order accounting fix

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/apply-order-accounting-fix.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Patch order accounting and profile refresh
        shell: python
        run: |
          from pathlib import Path
          import re

          # Backend: add idempotency flags to orders.
          p = Path("backend/server.py")
          s = p.read_text(encoding="utf-8")
          if "points_awarded: bool = False" not in s:
              anchor = '    payment_method: Optional[str] = None\n    payment_attempts: int = 0\n'
              if anchor not in s:
                  raise SystemExit("Order model anchor not found")
              s = s.replace(anchor, '    payment_method: Optional[str] = None\n    points_awarded: bool = False\n    spent_recorded: bool = False\n    payment_attempts: int = 0\n', 1)

          # COD: the UI promises points at checkout, so commit points + spent once.
          if 'if (order.payment_method or "cod").lower() == "cod" and order.user_id:' not in s:
              anchor = '''    # Purchase points are awarded only after verified payment.\n    # Do not mutate the user's reward balance while an order is unpaid.\n\n    return order_obj\n'''
              replacement = '''    if (order.payment_method or "cod").lower() == "cod" and order.user_id:\n        pts = int(order_obj.points_earned or 0)\n        inc = {"total_spent": float(order_obj.total_amount)}\n        if pts > 0:\n            inc["points"] = pts\n        await db.users.update_one({"id": order.user_id}, {"$inc": inc})\n        await db.orders.update_one(\n            {"id": order_obj.id},\n            {"$set": {"points_awarded": True, "spent_recorded": True}},\n        )\n        if pts > 0:\n            u = await db.users.find_one({"id": order.user_id})\n            new_points = int((u or {}).get("points", 0) or 0)\n            new_tier = "Platinum" if new_points >= 5000 else "Gold" if new_points >= 2000 else "Silver"\n            await db.users.update_one({"id": order.user_id}, {"$set": {"tier": new_tier}})\n            await db.wallet_transactions.insert_one(\n                WalletTransaction(\n                    user_id=order.user_id,\n                    type="credit",\n                    amount=pts,\n                    description=f"Reward points for order #{order_obj.id[:8]}",\n                    category="rewards",\n                    order_id=order_obj.id,\n                    balance_after=float((u or {}).get("wallet_balance", 0.0) or 0.0),\n                    is_points=True,\n                ).dict()\n            )\n\n    return order_obj\n'''
              if anchor not in s:
                  raise SystemExit("COD accounting anchor not found")
              s = s.replace(anchor, replacement, 1)

          # Razorpay: replace the old points-only block with points + spent accounting.
          if 'if not current_order.get("spent_recorded"):' not in s:
              pattern = re.compile(r'''    # Award purchase points once \(idempotent via payment_status transition above\)\n    pts = int\(order\.get\("points_earned", 0\) or 0\)\n    if pts > 0 and order\.get\("user_id"\):\n.*?\n    # TODO\(webhook-sprint\):''', re.S)
              replacement = '''    # Award purchase points and spending once after verified payment.\n    if order.get("user_id"):\n        current_order = await db.orders.find_one({"id": payload.order_id}) or order\n        pts = int(order.get("points_earned", 0) or 0)\n        if not current_order.get("points_awarded"):\n            u = await db.users.find_one({"id": order["user_id"]})\n            if u:\n                new_points = int(u.get("points", 0) or 0) + pts\n                new_tier = "Platinum" if new_points >= 5000 else "Gold" if new_points >= 2000 else "Silver"\n                await db.users.update_one(\n                    {"id": order["user_id"]},\n                    {"$inc": {"points": pts}, "$set": {"tier": new_tier}},\n                )\n                await db.orders.update_one(\n                    {"id": payload.order_id, "points_awarded": {"$ne": True}},\n                    {"$set": {"points_awarded": True}},\n                )\n                if pts > 0:\n                    await db.wallet_transactions.insert_one(\n                        WalletTransaction(\n                            user_id=order["user_id"], type="credit", amount=pts,\n                            description=f"Reward points for order #{payload.order_id[:8]}",\n                            category="rewards", order_id=payload.order_id,\n                            balance_after=float(u.get("wallet_balance", 0.0) or 0.0), is_points=True,\n                        ).dict()\n                    )\n        if not current_order.get("spent_recorded"):\n            await db.users.update_one(\n                {"id": order["user_id"]},\n                {"$inc": {"total_spent": float(order.get("total_amount", 0.0) or 0.0)}},\n            )\n            await db.orders.update_one(\n                {"id": payload.order_id, "spent_recorded": {"$ne": True}},\n                {"$set": {"spent_recorded": True}},\n            )\n\n    # TODO(webhook-sprint):'''
              s2, n = pattern.subn(replacement, s, count=1)
              if n != 1:
                  raise SystemExit("Razorpay accounting block not found")
              s = s2
          p.write_text(s, encoding="utf-8")

          # Frontend: refresh cached auth profile whenever the user returns to the tab.
          p = Path("frontend/src/context/AuthContext.js")
          s = p.read_text(encoding="utf-8")
          if "const refreshUser = useCallback" not in s:
              anchor = '''  const logout = useCallback(() => {\n    localStorage.removeItem('memoriesAuth');\n    setAuthHeader(null);\n    setToken(null);\n    setUser(null);\n    syncLegacyProfile(null);\n  }, []);\n\n  return (\n    <AuthContext.Provider value={{ user, token, loading, login, register, changePassword, logout, isAuthenticated: !!user }}>\n'''
              replacement = '''  const refreshUser = useCallback(async () => {\n    if (!token) return null;\n    const res = await axios.get(`${API}/auth/me`, { headers: { Authorization: `Bearer ${token}` } });\n    const freshUser = res.data.user;\n    setUser(freshUser);\n    localStorage.setItem('memoriesAuth', JSON.stringify({ token, user: freshUser }));\n    syncLegacyProfile(freshUser);\n    return freshUser;\n  }, [token]);\n\n  const logout = useCallback(() => {\n    localStorage.removeItem('memoriesAuth');\n    setAuthHeader(null);\n    setToken(null);\n    setUser(null);\n    syncLegacyProfile(null);\n  }, []);\n\n  useEffect(() => {\n    if (!token) return undefined;\n    const reconcile = () => { refreshUser().catch(() => {}); };\n    window.addEventListener('focus', reconcile);\n    document.addEventListener('visibilitychange', reconcile);\n    return () => {\n      window.removeEventListener('focus', reconcile);\n      document.removeEventListener('visibilitychange', reconcile);\n    };\n  }, [token, refreshUser]);\n\n  return (\n    <AuthContext.Provider value={{ user, token, loading, login, register, changePassword, refreshUser, logout, isAuthenticated: !!user }}>\n'''
              if anchor not in s:
                  raise SystemExit("AuthContext anchor not found")
              s = s.replace(anchor, replacement, 1)
          p.write_text(s, encoding="utf-8")

          # AccountButton: keep profile state aligned with wallet/profile API values.
          p = Path("frontend/src/components/AccountButton.js")
          s = p.read_text(encoding="utf-8")
          if "refreshUser" not in s.split("export const AccountButton",1)[1].split("return",1)[0]:
              s = s.replace(
                  "const { user, isAuthenticated, token, login, register, changePassword, logout } = useAuth();",
                  "const { user, isAuthenticated, token, login, register, changePassword, refreshUser, logout } = useAuth();",
                  1,
              )
          if "onBalanceUpdate={(wallet) =>" not in s:
              s = re.sub(
                  r"\{activeTab === ['\"]wallet['\"] && <DigitalWallet userId=\{user\.id\} ?/?>\}",
                  "{activeTab === 'wallet' && <DigitalWallet userId={user.id} onBalanceUpdate={(wallet) => { setUser((prev) => prev ? { ...prev, wallet_balance: wallet.balance, points: wallet.rewardPoints, store_credits: wallet.storeCredits, tier: wallet.tier, total_spent: wallet.totalSpent } : prev); }} />}\n",
                  s,
                  count=1,
              )
          p.write_text(s, encoding="utf-8")

          print("Clean order accounting repair applied")

      - name: Validate Python syntax
        run: python -m py_compile backend/server.py

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          CI=true npm run build

      - name: Commit source changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/server.py frontend/src/context/AuthContext.js frontend/src/components/AccountButton.js
          if git diff --cached --quiet; then
            echo "No source changes were needed"
            exit 0
          fi
          git commit -m "fix: reconcile order spending and reward points"
          git push origin main
