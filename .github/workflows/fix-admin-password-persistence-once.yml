name: One-time admin password persistence fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-admin-password-persistence-once.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply admin password persistence guard
        shell: python
        run: |
          from pathlib import Path
          import subprocess

          path = Path('backend/server.py')
          text = path.read_text(encoding='utf-8')

          old = '''        elif not verify_password(password, existing.get("password_hash", "")):\n            await db.admins.update_one(\n                {"username": username},\n                {"$set": {"password_hash": hash_password(password)}},\n            )\n            logger.info(f"Updated admin password for: {username}")\n'''

          new = '''        # Environment credentials are bootstrap credentials only. Once an admin\n        # record exists, never overwrite a database-managed password on restart.\n        # Password changes and recovery are persisted in MongoDB.\n'''

          if 'Environment credentials are bootstrap credentials only.' in text:
              print('ADMIN_PASSWORD_PERSISTENCE_GUARD_ALREADY_PRESENT')
          elif old in text:
              text = text.replace(old, new, 1)
              path.write_text(text, encoding='utf-8')
              print('ADMIN_PASSWORD_PERSISTENCE_GUARD_APPLIED')
          else:
              raise SystemExit('Expected admin password reseeding block was not found; refusing to modify server.py.')

          subprocess.run(['python', '-m', 'py_compile', 'backend/server.py'], check=True)
          subprocess.run(['git', 'diff', '--check'], check=True)
          print('PY_COMPILE_OK')

      - name: Verify guard
        shell: python
        run: |
          from pathlib import Path
          text = Path('backend/server.py').read_text(encoding='utf-8')
          if 'elif not verify_password(password, existing.get("password_hash", "")):' in text:
              raise SystemExit('Admin password reseeding is still present.')
          if 'Environment credentials are bootstrap credentials only.' not in text:
              raise SystemExit('Bootstrap-only admin password guard is missing.')
          print('ADMIN_PASSWORD_PERSISTENCE_GUARD_OK')

      - name: Commit source fix and remove this one-time workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/server.py
          git rm .github/workflows/fix-admin-password-persistence-once.yml
          git commit -m 'security: preserve database-managed admin password'
          git push origin HEAD:main
