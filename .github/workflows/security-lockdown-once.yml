name: Security lockdown (one-time)

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message != 'security: complete password reset lockdown [skip ci]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Apply password reset security fixes
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('backend/server.py')
          s = p.read_text()

          old_model = '''class ResetPasswordRequest(BaseModel):
              email: str
              new_password: str
              token: Optional[str] = None   # from forgot-password (logged to server)
              phone: Optional[str] = None   # OR registered-phone verification (no SMTP path)
          '''
          new_model = '''class ResetPasswordRequest(BaseModel):
              email: str
              new_password: str
              token: str
          '''
          if old_model not in s:
              raise SystemExit('ResetPasswordRequest block not found; refusing to patch')
          s = s.replace(old_model, new_model, 1)

          old_forgot = '''@api_router.post("/auth/forgot-password")
          async def forgot_password(req: ForgotPasswordRequest):
              """Unauthenticated. Generates a short-lived reset token, stores it hashed with a TTL
              expiry, and logs it to the server (no SMTP configured). Always returns a generic
              response so it never reveals whether an email is registered."""
              email = (req.email or "").strip().lower()
              generic = {"success": True,
                         "message": "If an account exists for that email, a reset option is available. "
                                    "You can reset using your registered phone number."}
              user = await db.users.find_one({"email": email})
              if user:
                  raw_token = secrets.token_urlsafe(32)
                  expires_at = datetime.now(timezone.utc) + timedelta(hours=1)
                  await db.password_reset_tokens.insert_one({
                      "user_id": user["id"],
                      "email": email,
                      "token_hash": _hash_token(raw_token),
                      "used": False,
                      "created_at": datetime.now(timezone.utc).isoformat(),
                      "expires_at": expires_at,
                  })
                  # No SMTP: log the token so it can be retrieved from server logs during debugging.
                  logger.warning(f"[PASSWORD RESET] token for {email} (valid 1h): {raw_token}")
              return generic
          '''
          new_forgot = '''@api_router.post("/auth/forgot-password")
          async def forgot_password(req: ForgotPasswordRequest):
              """Unauthenticated password-reset request.
              Creates a short-lived, hashed one-time token when the account exists.
              Never logs or returns the raw token, and always returns a generic response.
              A real delivery channel (email/SMS) must be wired to deliver the token before
              self-service password recovery is enabled in production."""
              email = (req.email or "").strip().lower()
              generic = {
                  "success": True,
                  "message": "If an account exists for that email, a password reset option will be available.",
              }
              user = await db.users.find_one({"email": email})
              if user:
                  raw_token = secrets.token_urlsafe(32)
                  expires_at = datetime.now(timezone.utc) + timedelta(hours=1)
                  await db.password_reset_tokens.insert_one({
                      "user_id": user["id"],
                      "email": email,
                      "token_hash": _hash_token(raw_token),
                      "used": False,
                      "created_at": datetime.now(timezone.utc).isoformat(),
                      "expires_at": expires_at,
                  })
                  # SECURITY: never log the raw reset token. Deliver it only through a
                  # verified email/SMS provider once configured.
              return generic
          '''
          if old_forgot not in s:
              raise SystemExit('forgot_password block not found; refusing to patch')
          s = s.replace(old_forgot, new_forgot, 1)

          start = s.index('@api_router.post("/auth/reset-password")')
          end = s.index('\n\nclass ChangePasswordRequest', start)
          new_reset = '''@api_router.post("/auth/reset-password")
          async def reset_password(req: ResetPasswordRequest):
              """Unauthenticated self-service reset using a one-time reset token only.
              Phone-number knowledge is deliberately not accepted as proof of identity."""
              email = (req.email or "").strip().lower()
              if len(req.new_password) < 8:
                  raise HTTPException(status_code=400, detail="Password must be at least 8 characters")
              if len(req.new_password.encode("utf-8")) > 72:
                  raise HTTPException(status_code=400, detail="Password must be 72 bytes or fewer")
              if not req.token or len(req.token) > 512:
                  raise HTTPException(status_code=400, detail="Invalid or expired reset token")

              user = await db.users.find_one({"email": email})
              if not user:
                  raise HTTPException(status_code=400, detail="Invalid or expired reset token")

              token_hash = _hash_token(req.token)
              token_doc = await db.password_reset_tokens.find_one({
                  "email": email,
                  "token_hash": token_hash,
                  "used": False,
              })
              if not token_doc:
                  raise HTTPException(status_code=400, detail="Invalid or expired reset token")

              exp_dt = token_doc.get("expires_at")
              if not isinstance(exp_dt, datetime):
                  raise HTTPException(status_code=400, detail="Invalid or expired reset token")
              if exp_dt.tzinfo is None:
                  exp_dt = exp_dt.replace(tzinfo=timezone.utc)
              if exp_dt < datetime.now(timezone.utc):
                  raise HTTPException(status_code=400, detail="Invalid or expired reset token")

              # Consume the token atomically so it cannot be replayed by concurrent requests.
              consumed = await db.password_reset_tokens.update_one(
                  {"_id": token_doc["_id"], "used": False},
                  {"$set": {"used": True, "used_at": datetime.now(timezone.utc)}},
              )
              if consumed.modified_count != 1:
                  raise HTTPException(status_code=400, detail="Invalid or expired reset token")

              await db.users.update_one(
                  {"id": user["id"]},
                  {"$set": {"password_hash": hash_password(req.new_password), "must_change_password": False}},
              )
              # Invalidate any other outstanding reset tokens for this account.
              await db.password_reset_tokens.update_many(
                  {"email": email, "used": False},
                  {"$set": {"used": True, "used_at": datetime.now(timezone.utc)}},
              )
              return {"success": True, "message": "Password updated. You can now log in with your new password."}
          '''
          s = s[:start] + new_reset + s[end:]

          # Strengthen registration password minimum to match reset policy.
          s = s.replace(
              'if len(req.password) < 6:\n        raise HTTPException(status_code=400, detail="Password must be at least 6 characters")',
              'if len(req.password) < 8:\n        raise HTTPException(status_code=400, detail="Password must be at least 8 characters")',
              1,
          )

          p.write_text(s)
          PY

      - name: Validate backend syntax
        run: python -m py_compile backend/server.py

      - name: Commit and remove one-time workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/security-lockdown-once.yml
          git add backend/server.py
          git commit -m "security: complete password reset lockdown [skip ci]"
          git push origin main
