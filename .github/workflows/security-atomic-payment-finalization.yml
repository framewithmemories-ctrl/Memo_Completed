name: Security - verify atomic payment finalization

on:
  push:
    branches: [main]
    paths:
      - "backend/server.py"
      - ".github/workflows/security-atomic-payment-finalization.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-payment-finalization:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify atomic payment finalization
        shell: python
        run: |
          from pathlib import Path

          text = Path("backend/server.py").read_text(encoding="utf-8")

          required = [
              'finalize_result = await db.orders.update_one(',
              '"payment_status": {"$in": ["pending", "failed"]}',
              'if finalize_result.modified_count != 1:',
              '"already_paid": True',
          ]

          missing = [item for item in required if item not in text]
          if missing:
              print("Missing atomic payment finalization markers:")
              for item in missing:
                  print(f"- {item}")
              raise SystemExit(1)

          if 'await db.orders.update_one(\n        {"id": payload.order_id},' in text:
              raise SystemExit("Found the old unconditional payment finalization pattern; refusing verification")

          print("Atomic payment finalization verification passed.")

      - name: Syntax check
        run: python -m py_compile backend/server.py
