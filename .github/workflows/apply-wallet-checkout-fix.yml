name: Apply wallet checkout integrity fix

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Apply safe wallet/store-credit alignment
        shell: python
        run: |
          from pathlib import Path
          from textwrap import dedent
          import re

          backend = Path('backend/server.py')
          text = backend.read_text()

          old_model = dedent('''
          class OrderCreate(BaseModel):
              user_id: str
              items: List[dict]
              total_amount: float
              delivery_type: str
              delivery_address: Optional[dict] = None
              pickup_slot: Optional[str] = None''').strip()
          new_model = dedent('''
          class OrderCreate(BaseModel):
              user_id: str
              items: List[dict]
              total_amount: float
              delivery_type: str
              delivery_address: Optional[dict] = None
              pickup_slot: Optional[str] = None
              use_store_credit: bool = False''').strip()
          if old_model not in text:
              raise SystemExit('OrderCreate block not found')
          text = text.replace(old_model, new_model, 1)

          pattern = r'''    total = order\.total_amount\n.*?    return order_obj'''
          replacement = dedent('''
              # Server-authoritative totals: checkout display and stored order must use the same rules.
              user = await db.users.find_one({"id": current["id"]})
              delivery = 0.0 if (order.delivery_type == "pickup" or computed_subtotal >= 1000) else 50.0
              tax = round(computed_subtotal * 0.18)
              store_credit_applied = 0.0
              if order.use_store_credit and user:
                  available = float(user.get("store_credits", 0.0) or 0.0)
                  store_credit_applied = max(0.0, min(available, computed_subtotal + delivery + tax))
              final_amount = max(0.0, computed_subtotal + delivery + tax - store_credit_applied)

              # Points are earned from validated subtotal, not the client-supplied total.
              points_earned = int(computed_subtotal * 0.03)

              order_dict = order.dict()
              order_dict["total_amount"] = round(final_amount, 2)
              order_dict["store_credit_applied"] = round(store_credit_applied, 2)
              order_dict["points_earned"] = points_earned
              order_obj = Order(**order_dict)

              # Commit store credit only when this order actually uses it. The conditional
              # update prevents two concurrent checkouts from spending the same credit.
              if store_credit_applied > 0 and order.user_id:
                  debit = await db.users.update_one(
                      {"id": order.user_id, "store_credits": {"$gte": store_credit_applied}},
                      {"$inc": {"store_credits": -store_credit_applied}},
                  )
                  if debit.matched_count != 1:
                      raise HTTPException(status_code=409, detail="Store credit changed. Please refresh and try again.")

              try:
                  await db.orders.insert_one(order_obj.dict())
              except Exception:
                  if store_credit_applied > 0 and order.user_id:
                      await db.users.update_one(
                          {"id": order.user_id},
                          {"$inc": {"store_credits": store_credit_applied}},
                      )
                  raise

              if store_credit_applied > 0 and order.user_id:
                  await db.wallet_transactions.insert_one(
                      WalletTransaction(
                          user_id=order.user_id,
                          type="debit",
                          amount=store_credit_applied,
                          description=f"Store credit for order #{order_obj.id[:8]}",
                          category="purchase",
                          order_id=order_obj.id,
                          balance_after=max(0.0, float((user or {}).get("store_credits", 0.0) or 0.0) - store_credit_applied),
                      ).dict()
                  )

              return order_obj''').lstrip('\n')
          text, count = re.subn(pattern, replacement, text, count=1, flags=re.S)
          if count != 1:
              raise SystemExit(f'create_order pricing block replacement count={count}')
          backend.write_text(text)

          frontend = Path('frontend/src/components/EnhancedCheckoutPage.js')
          text = frontend.read_text()

          old_wallet = "axios.get(`${API}/users/${user.id}/wallet`).then((r) => setUserWallet({ balance: r.data.balance || 0 })).catch(() => {});"
          new_wallet = "axios.get(`${API}/users/${user.id}/wallet`).then((r) => setUserWallet({ balance: r.data.store_credits || 0 })).catch(() => {});"
          if old_wallet not in text:
              raise SystemExit('frontend wallet fetch not found')
          text = text.replace(old_wallet, new_wallet, 1)

          old_order_payload = dedent('''
                  delivery_type: formData.deliveryType,
                  delivery_address: address,
                })).data;''').strip()
          new_order_payload = dedent('''
                  delivery_type: formData.deliveryType,
                  delivery_address: address,
                  use_store_credit: !!(useWalletBalance && user),
                })).data;''').strip()
          if old_order_payload not in text:
              raise SystemExit('frontend order payload block not found')
          text = text.replace(old_order_payload, new_order_payload, 1)

          old_wallet_pay = dedent('''
                if (useWalletBalance && user && totals.walletDiscount > 0) {
                  await axios.post(`${API}/users/${user.id}/wallet/pay`, null, {
                    params: { amount: totals.walletDiscount, order_id: order.id },
                  }).catch(() => {});
                }

                finalizeOrder(order, totals);''').strip()
          new_wallet_pay = dedent('''
                const serverTotals = {
                  ...totals,
                  walletDiscount: Number(order.store_credit_applied || 0),
                  final: Number(order.total_amount || totals.final),
                };
                finalizeOrder(order, serverTotals);''').strip()
          if old_wallet_pay not in text:
              raise SystemExit('frontend wallet-pay block not found')
          text = text.replace(old_wallet_pay, new_wallet_pay, 1)
          frontend.write_text(text)

          Path('.github/workflows/apply-wallet-checkout-fix.yml').unlink()

      - name: Commit fix and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/server.py frontend/src/components/EnhancedCheckoutPage.js .github/workflows/apply-wallet-checkout-fix.yml
          git commit -m "fix: align wallet checkout totals with store credits"
          git push