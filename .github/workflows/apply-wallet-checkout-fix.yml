name: Apply wallet checkout integrity fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply-fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Repair wallet order accounting
        shell: python
        run: |
          from pathlib import Path

          bpath = Path('backend/server.py')
          b = bpath.read_text()

          # Order model fields
          if 'subtotal_amount: Optional[float] = None' not in b:
              b = b.replace('    store_credit_applied: float = 0.0\n    payment_attempts: int = 0', '    store_credit_applied: float = 0.0\n    subtotal_amount: Optional[float] = None\n    delivery_amount: Optional[float] = None\n    tax_amount: Optional[float] = None\n    payment_method: Optional[str] = None\n    payment_attempts: int = 0', 1)
          if 'payment_method: Optional[str] = None\n\nclass GiftQuizResponse' not in b:
              b = b.replace('    use_store_credit: bool = False\n\nclass GiftQuizResponse', '    use_store_credit: bool = False\n    payment_method: Optional[str] = None\n\nclass GiftQuizResponse', 1)
          if 'payment_method: Optional[str] = "razorpay"' not in b:
              b = b.replace('    use_store_credit: bool = False\n\n\n# Razorpay single-transaction', '    use_store_credit: bool = False\n    payment_method: Optional[str] = "razorpay"\n\n\n# Razorpay single-transaction', 1)

          # Wallet applies against item subtotal only. Tax and delivery remain payable.
          b = b.replace('min(available_credit, computed_subtotal + delivery_amount + tax_amount)', 'min(available_credit, computed_subtotal)')
          b = b.replace('min(available, subtotal + delivery + tax)', 'min(available, subtotal)')

          # Use wallet_balance consistently for the real customer wallet.
          b = b.replace('{"id": order.user_id, "store_credits": {"$gte": store_credit_applied}}', '{"id": order.user_id, "wallet_balance": {"$gte": store_credit_applied}}')
          b = b.replace('{"$inc": {"store_credits": -store_credit_applied}}', '{"$inc": {"wallet_balance": -store_credit_applied}}')
          b = b.replace('{"$inc": {"store_credits": store_credit_applied}}', '{"$inc": {"wallet_balance": store_credit_applied}}')
          b = b.replace('float((updated_user or {}).get("store_credits", 0.0) or 0.0)', 'float((updated_user or {}).get("wallet_balance", 0.0) or 0.0)')
          b = b.replace('float(u.get("store_credits", 0.0) or 0.0) - sc', 'float(u.get("wallet_balance", 0.0) or 0.0) - sc')
          b = b.replace('{"$set": {"store_credits": new_credit}}', '{"$set": {"wallet_balance": new_credit}}')

          # Persist the complete financial breakdown on new orders.
          if 'order_dict["subtotal_amount"]' not in b:
              b = b.replace('    order_dict["store_credit_applied"] = round(store_credit_applied, 2)\n    order_dict["points_earned"] = points_earned', '    order_dict["store_credit_applied"] = round(store_credit_applied, 2)\n    order_dict["subtotal_amount"] = round(computed_subtotal, 2)\n    order_dict["delivery_amount"] = round(delivery_amount, 2)\n    order_dict["tax_amount"] = round(tax_amount, 2)\n    order_dict["payment_method"] = order.payment_method or "cod"\n    order_dict["points_earned"] = points_earned', 1)
          if 'subtotal_amount=round(pricing["subtotal"], 2)' not in b:
              b = b.replace('        store_credit_applied=pricing["store_credit_applied"],\n        payment_status="pending",', '        store_credit_applied=pricing["store_credit_applied"],\n        subtotal_amount=round(pricing["subtotal"], 2),\n        delivery_amount=round(pricing["delivery"], 2),\n        tax_amount=round(pricing["tax"], 2),\n        payment_method=payload.payment_method or "razorpay",\n        payment_status="pending",', 1)
          bpath.write_text(b)

          # Checkout sends the payment method for persistence.
          cpath = Path('frontend/src/components/EnhancedCheckoutPage.js')
          c = cpath.read_text()
          if 'payment_method: "razorpay"' not in c:
              c = c.replace('        use_store_credit: !!(useWalletBalance && user),\n      })).data;', '        use_store_credit: !!(useWalletBalance && user),\n        payment_method: "razorpay",\n      })).data;', 1)
          if 'payment_method: "cod"' not in c:
              c = c.replace('        use_store_credit: !!(useWalletBalance && user),\n      })).data;\n\n      const serverTotals', '        use_store_credit: !!(useWalletBalance && user),\n        payment_method: "cod",\n      })).data;\n\n      const serverTotals', 1)
          cpath.write_text(c)

          # Admin displays the stored financial breakdown.
          apath = Path('frontend/src/components/AdminPanel.js')
          a = apath.read_text()
          a = a.replace('<p><span className="font-medium">Payment method:</span> {orderDetails.payment_method||\'Not recorded\'}</p>', '<p><span className="font-medium">Payment method:</span> {orderDetails.payment_method || (orderDetails.razorpay_payment_id ? \'razorpay\' : \'cod\')}</p>', 1)
          marker = '<CardContent className="space-y-2 text-sm"><div className="flex justify-between"><span>Item subtotal</span>'
          i = a.find(marker)
          if i < 0: raise SystemExit('Admin totals marker not found')
          j = a.find('</CardContent>', i)
          block = a[i:j]
          if 'Tax (GST 18%)' not in block:
              replacement = '<CardContent className="space-y-2 text-sm"><div className="flex justify-between"><span>Item subtotal</span><span>₹{Number(orderDetails.subtotal_amount ?? (orderDetails.items||[]).reduce((sum,item)=>sum+Number(item.price||0)*Number(item.quantity||0),0)).toLocaleString()}</span></div><div className="flex justify-between"><span>Delivery</span><span>{Number(orderDetails.delivery_amount ?? 0) === 0 ? \'FREE\' : `₹${Number(orderDetails.delivery_amount).toLocaleString()}`}</span></div><div className="flex justify-between"><span>Tax (GST 18%)</span><span>₹{Number(orderDetails.tax_amount ?? 0).toLocaleString()}</span></div><div className="flex justify-between text-green-600"><span>Wallet discount</span><span>-₹{Number(orderDetails.store_credit_applied||0).toLocaleString()}</span></div><div className="flex justify-between border-t pt-2 font-bold"><span>Final total</span><span>₹{Number(orderDetails.total||orderDetails.total_amount||0).toLocaleString()}</span></div><p className="text-xs text-gray-500 pt-2">Wallet discounts apply to the item subtotal. Tax and delivery remain part of the final payable total.</p>'
              a = a[:i] + replacement + a[j:]
          apath.write_text(a)
          print('repair complete')

      - name: Validate and commit
        shell: bash
        run: |
          python -m py_compile backend/server.py
          grep -q 'wallet_balance' backend/server.py
          grep -q 'subtotal_amount' backend/server.py
          grep -q 'Tax (GST 18%)' frontend/src/components/AdminPanel.js
          git add backend/server.py frontend/src/components/EnhancedCheckoutPage.js frontend/src/components/AdminPanel.js
          git rm -f .github/workflows/one-shot-order-financial-fix.yml .github/order-financial-repair-trigger.txt 2>/dev/null || true
          git add -u
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git diff --cached --quiet; then echo 'No application changes'; exit 0; fi
          git commit -m 'fix: align wallet discount and admin order totals'
          git push origin main