name: One-shot order financial repair

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch application
        shell: python
        run: |
          from pathlib import Path

          p = Path('backend/server.py')
          s = p.read_text()
          if 'subtotal_amount: Optional[float]' not in s:
              s = s.replace('    store_credit_applied: float = 0.0\n    payment_attempts: int = 0', '    store_credit_applied: float = 0.0\n    subtotal_amount: Optional[float] = None\n    delivery_amount: Optional[float] = None\n    tax_amount: Optional[float] = None\n    payment_method: Optional[str] = None\n    payment_attempts: int = 0', 1)
          if 'payment_method: Optional[str] = None\n\nclass GiftQuizResponse' not in s:
              s = s.replace('    use_store_credit: bool = False\n\nclass GiftQuizResponse', '    use_store_credit: bool = False\n    payment_method: Optional[str] = None\n\nclass GiftQuizResponse', 1)
          if 'payment_method: Optional[str] = "razorpay"' not in s:
              s = s.replace('    use_store_credit: bool = False\n\n\n# Razorpay single-transaction', '    use_store_credit: bool = False\n    payment_method: Optional[str] = "razorpay"\n\n\n# Razorpay single-transaction', 1)
          s = s.replace('store_credit_applied = max(0.0, min(available_credit, computed_subtotal + delivery_amount + tax_amount))', 'store_credit_applied = max(0.0, min(available_credit, computed_subtotal))', 1)
          s = s.replace('store_credit_applied = max(0.0, min(available, subtotal + delivery + tax))', 'store_credit_applied = max(0.0, min(available, subtotal))', 1)
          if 'order_dict["subtotal_amount"]' not in s:
              s = s.replace('    order_dict["store_credit_applied"] = round(store_credit_applied, 2)\n    order_dict["points_earned"] = points_earned', '    order_dict["store_credit_applied"] = round(store_credit_applied, 2)\n    order_dict["subtotal_amount"] = round(computed_subtotal, 2)\n    order_dict["delivery_amount"] = round(delivery_amount, 2)\n    order_dict["tax_amount"] = round(tax_amount, 2)\n    order_dict["payment_method"] = order.payment_method or "cod"\n    order_dict["points_earned"] = points_earned', 1)
          if 'subtotal_amount=round(pricing["subtotal"], 2)' not in s:
              s = s.replace('        store_credit_applied=pricing["store_credit_applied"],\n        payment_status="pending",', '        store_credit_applied=pricing["store_credit_applied"],\n        subtotal_amount=round(pricing["subtotal"], 2),\n        delivery_amount=round(pricing["delivery"], 2),\n        tax_amount=round(pricing["tax"], 2),\n        payment_method=payload.payment_method or "razorpay",\n        payment_status="pending",', 1)
          s = s.replace('{"id": order.user_id, "store_credits": {"$gte": store_credit_applied}}', '{"id": order.user_id, "wallet_balance": {"$gte": store_credit_applied}}')
          s = s.replace('{"$inc": {"store_credits": -store_credit_applied}}', '{"$inc": {"wallet_balance": -store_credit_applied}}')
          s = s.replace('{"$inc": {"store_credits": store_credit_applied}}', '{"$inc": {"wallet_balance": store_credit_applied}}')
          s = s.replace('float((updated_user or {}).get("store_credits", 0.0) or 0.0)', 'float((updated_user or {}).get("wallet_balance", 0.0) or 0.0)')
          p.write_text(s)

          p = Path('frontend/src/components/EnhancedCheckoutPage.js')
          s = p.read_text()
          if 'payment_method: "razorpay"' not in s:
              s = s.replace('        use_store_credit: !!(useWalletBalance && user),\n      })).data;', '        use_store_credit: !!(useWalletBalance && user),\n        payment_method: "razorpay",\n      })).data;', 1)
          if 'payment_method: "cod"' not in s:
              s = s.replace('        use_store_credit: !!(useWalletBalance && user),\n      })).data;\n\n      const serverTotals', '        use_store_credit: !!(useWalletBalance && user),\n        payment_method: "cod",\n      })).data;\n\n      const serverTotals', 1)
          p.write_text(s)

          p = Path('frontend/src/components/AdminPanel.js')
          s = p.read_text()
          s = s.replace('<p><span className="font-medium">Payment method:</span> {orderDetails.payment_method||\'Not recorded\'}</p>', '<p><span className="font-medium">Payment method:</span> {orderDetails.payment_method || (orderDetails.razorpay_payment_id ? \'razorpay\' : \'cod\')}</p>', 1)
          marker = '<CardContent className="space-y-2 text-sm"><div className="flex justify-between"><span>Item subtotal</span>'
          i = s.find(marker)
          if i < 0: raise SystemExit('Admin totals marker not found')
          j = s.find('</CardContent>', i)
          if j < 0: raise SystemExit('Admin totals end not found')
          block = s[i:j]
          if 'Tax (GST 18%)' not in block:
              replacement = '<CardContent className="space-y-2 text-sm"><div className="flex justify-between"><span>Item subtotal</span><span>₹{Number(orderDetails.subtotal_amount ?? (orderDetails.items||[]).reduce((sum,item)=>sum+Number(item.price||0)*Number(item.quantity||0),0)).toLocaleString()}</span></div><div className="flex justify-between"><span>Delivery</span><span>{Number(orderDetails.delivery_amount ?? 0) === 0 ? \'FREE\' : `₹${Number(orderDetails.delivery_amount).toLocaleString()}`}</span></div><div className="flex justify-between"><span>Tax (GST 18%)</span><span>₹{Number(orderDetails.tax_amount ?? 0).toLocaleString()}</span></div><div className="flex justify-between text-green-600"><span>Wallet discount</span><span>-₹{Number(orderDetails.store_credit_applied||0).toLocaleString()}</span></div><div className="flex justify-between border-t pt-2 font-bold"><span>Final total</span><span>₹{Number(orderDetails.total||orderDetails.total_amount||0).toLocaleString()}</span></div><p className="text-xs text-gray-500 pt-2">Wallet discounts apply to the item subtotal. Tax and delivery remain part of the final payable total.</p>'
              s = s[:i] + replacement + s[j:]
          p.write_text(s)
          print('order financial repair complete')
      - name: Verify, remove repair workflow, and commit
        shell: bash
        run: |
          python -m py_compile backend/server.py
          grep -q 'wallet_balance' backend/server.py
          grep -q 'subtotal_amount' backend/server.py
          grep -q 'Tax (GST 18%)' frontend/src/components/AdminPanel.js
          git add backend/server.py frontend/src/components/EnhancedCheckoutPage.js frontend/src/components/AdminPanel.js
          git rm -f .github/workflows/one-shot-order-financial-fix.yml .github/order-financial-repair-trigger.txt 2>/dev/null || true
          git add -u
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'fix: align wallet discount and admin order totals'
          git push origin main