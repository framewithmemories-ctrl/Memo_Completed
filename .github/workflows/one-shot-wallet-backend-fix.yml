name: One-shot wallet backend repair v2

on:
  pull_request_target:
    types: [opened, synchronize]
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: github.event.pull_request.head.ref == 'wallet-backend-repair' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          repository: ${{ github.repository }}
          fetch-depth: 0
      - name: Patch wallet source of truth
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('backend/server.py')
          s = p.read_text()
          replacements = [
              ('available_credit = float((user or {}).get("store_credits", 0.0) or 0.0)',
               'available_credit = float((user or {}).get("wallet_balance", 0.0) or 0.0)'),
              ('available = float(user.get("store_credits", 0.0) or 0.0)',
               'available = float(user.get("wallet_balance", 0.0) or 0.0)'),
              ('float(u.get("store_credits", 0.0) or 0.0) - sc',
               'float(u.get("wallet_balance", 0.0) or 0.0) - sc'),
              ('{"$set": {"store_credits": new_credit}}',
               '{"$set": {"wallet_balance": new_credit}}'),
              ('{"id": order.user_id, "store_credits": {"$gte": store_credit_applied}}',
               '{"id": order.user_id, "wallet_balance": {"$gte": store_credit_applied}}'),
              ('{"$inc": {"store_credits": -store_credit_applied}}',
               '{"$inc": {"wallet_balance": -store_credit_applied}}'),
              ('{"$inc": {"store_credits": store_credit_applied}}',
               '{"$inc": {"wallet_balance": store_credit_applied}}'),
              ('float((updated_user or {}).get("store_credits", 0.0) or 0.0)',
               'float((updated_user or {}).get("wallet_balance", 0.0) or 0.0)'),
          ]
          for old, new in replacements:
              if old not in s:
                  raise SystemExit(f'Missing expected source text: {old}')
              s = s.replace(old, new)
          p.write_text(s)
          PY
      - name: Verify patch
        run: |
          python - <<'PY'
          from pathlib import Path
          s = Path('backend/server.py').read_text()
          required = [
              'available_credit = float((user or {}).get("wallet_balance", 0.0) or 0.0)',
              'available = float(user.get("wallet_balance", 0.0) or 0.0)',
              'float(u.get("wallet_balance", 0.0) or 0.0) - sc',
              '{"$set": {"wallet_balance": new_credit}}',
              '{"id": order.user_id, "wallet_balance": {"$gte": store_credit_applied}}',
              '{"$inc": {"wallet_balance": -store_credit_applied}}',
              '{"$inc": {"wallet_balance": store_credit_applied}}',
              'float((updated_user or {}).get("wallet_balance", 0.0) or 0.0)',
          ]
          for text in required:
              assert text in s, text
          print('wallet backend patch verified')
          PY
      - name: Commit repair and remove one-shot workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/one-shot-wallet-backend-fix.yml
          git add backend/server.py
          git commit -m 'fix: use wallet balance for checkout discount'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}