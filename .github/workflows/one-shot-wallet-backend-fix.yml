name: One-shot wallet backend repair v2

on:
  pull_request_target:
    types: [opened, synchronize, reopened]
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: startsWith(github.event.pull_request.head.ref, 'wallet-backend-repair') && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          repository: ${{ github.repository }}
          fetch-depth: 0
      - name: Patch wallet debit paths
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('backend/server.py')
          s = p.read_text()
          replacements = [
              ('{"id": order.user_id, "store_credits": {"$gte": store_credit_applied}}',
               '{"id": order.user_id, "wallet_balance": {"$gte": store_credit_applied}}'),
              ('{"$inc": {"store_credits": -store_credit_applied}}',
               '{"$inc": {"wallet_balance": -store_credit_applied}}'),
              ('{"$inc": {"store_credits": store_credit_applied}}',
               '{"$inc": {"wallet_balance": store_credit_applied}}'),
              ('float((updated_user or {}).get("store_credits", 0.0) or 0.0)',
               'float((updated_user or {}).get("wallet_balance", 0.0) or 0.0)'),
          ]
          changed = 0
          for old, new in replacements:
              if old in s:
                  s = s.replace(old, new)
                  changed += 1
          if changed != len(replacements):
              raise SystemExit(f'Expected {len(replacements)} wallet debit replacements, applied {changed}')
          p.write_text(s)
          PY
      - name: Verify wallet paths
        run: |
          python - <<'PY'
          from pathlib import Path
          s = Path('backend/server.py').read_text()
          required = [
              '{"id": order.user_id, "wallet_balance": {"$gte": store_credit_applied}}',
              '{"$inc": {"wallet_balance": -store_credit_applied}}',
              '{"$inc": {"wallet_balance": store_credit_applied}}',
              'float((updated_user or {}).get("wallet_balance", 0.0) or 0.0)',
          ]
          for text in required:
              assert text in s, text
          print('wallet debit paths verified')
          PY
      - name: Commit repair and remove one-shot workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/one-shot-wallet-backend-fix.yml
          git rm .github/wallet-repair-trigger.txt
          git add backend/server.py
          git commit -m 'fix: use wallet balance for checkout discount'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}